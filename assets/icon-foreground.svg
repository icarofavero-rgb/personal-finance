<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Carteira minimalista com cartões roxos atrás (área segura do Android) -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- brilho roxo atrás de tudo -->
  <g filter="url(#soft)" opacity="0.75">
    <rect x="330" y="420" width="370" height="270" rx="64" fill="none" stroke="#8b5cf6" stroke-width="40"/>
  </g>

  <!-- cartões -->
  <rect x="402" y="318" width="282" height="150" rx="34" fill="url(#card2)" transform="rotate(-11 543 393)"/>
  <rect x="384" y="350" width="292" height="150" rx="34" fill="url(#card)" transform="rotate(-4 530 425)"/>

  <!-- carteira -->
  <rect x="330" y="430" width="370" height="260" rx="60" fill="#0d0a18" stroke="#ede9fe" stroke-width="26"/>
  <rect x="598" y="508" width="132" height="104" rx="44" fill="#0d0a18" stroke="#ede9fe" stroke-width="26"/>
  <circle cx="648" cy="560" r="17" fill="none" stroke="#ede9fe" stroke-width="20"/>
</svg>
